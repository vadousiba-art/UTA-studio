[package]
name = "uta-vocal-lab"
description = "UTA Vocal Lab — AI-assisted singing coach and recording studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "uta_vocal_lab_lib"
